<svg xmlns="http://www.w3.org/2000/svg" width="680" height="575" viewBox="0 0 680 575" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>ADC_TCRT5000 전체 회로도</title>
  <desc>NUCLEO-G474RE에 TCRT5000 두 개(IR LED는 5V와 200옴, 포토트랜지스터는 3.3V 10킬로옴 풀업으로 PA0, PA1)와 BT04-A 블루투스 모듈(5V 전원, PC4 TX에서 RXD, TXD에서 PC5 RX)을 연결한 회로</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts { font-size: 12px; fill: #444441; }
      .w  { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="575" fill="#FFFFFF"/>

  <!-- NUCLEO -->
  <rect x="40" y="40" width="130" height="480" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="105" y="275" text-anchor="middle" dominant-baseline="central">NUCLEO</text>
  <text class="ts" x="105" y="293" text-anchor="middle" dominant-baseline="central">G474RE</text>
  <text class="ts" x="160" y="60" text-anchor="end" dominant-baseline="central">5V</text>
  <text class="ts" x="160" y="100" text-anchor="end" dominant-baseline="central">3V3</text>
  <text class="ts" x="160" y="180" text-anchor="end" dominant-baseline="central">PA0 (A0)</text>
  <text class="ts" x="160" y="210" text-anchor="end" dominant-baseline="central">PA1 (A1)</text>
  <text class="ts" x="160" y="340" text-anchor="end" dominant-baseline="central">GND</text>
  <text class="ts" x="160" y="440" text-anchor="end" dominant-baseline="central">PC4 (TX)</text>
  <text class="ts" x="160" y="465" text-anchor="end" dominant-baseline="central">PC5 (RX)</text>
  <text class="ts" x="160" y="490" text-anchor="end" dominant-baseline="central">GND</text>

  <!-- BT04-A -->
  <rect x="440" y="400" width="180" height="105" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="t" x="530" y="455" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">BT04-A</text>
  <text class="ts" x="530" y="475" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">ZS-040</text>
  <text class="ts" x="610" y="418" text-anchor="end" dominant-baseline="central" style="fill:#3C3489">VCC</text>
  <text class="ts" x="450" y="440" dominant-baseline="central" style="fill:#3C3489">RXD</text>
  <text class="ts" x="450" y="465" dominant-baseline="central" style="fill:#3C3489">TXD</text>
  <text class="ts" x="450" y="490" dominant-baseline="central" style="fill:#3C3489">GND</text>

  <!-- 전원 / GND -->
  <path d="M170 60 L656 60 L656 418 L620 418" fill="none" stroke="#D85A30" stroke-width="1.5"/>
  <line x1="170" y1="100" x2="380" y2="100" stroke="#1D9E75" stroke-width="1.5"/>
  <line x1="170" y1="340" x2="600" y2="340" stroke="#888780" stroke-width="1.5"/>
  <line x1="170" y1="490" x2="440" y2="490" stroke="#888780" stroke-width="1.5"/>

  <!-- UART -->
  <line class="w" x1="170" y1="440" x2="437" y2="440" marker-end="url(#arrow)"/>
  <line class="w" x1="440" y1="465" x2="173" y2="465" marker-end="url(#arrow)"/>
  <text class="ts" x="305" y="512" text-anchor="middle" dominant-baseline="central">USART1 9600bps 8N1</text>

  <!-- 센서 1 포토트랜지스터 -->
  <line x1="260" y1="100" x2="260" y2="115" stroke="#1D9E75" stroke-width="1.5"/>
  <rect x="252" y="115" width="16" height="40" rx="2" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <text class="ts" x="274" y="135" dominant-baseline="central">10kΩ</text>
  <line class="w" x1="260" y1="155" x2="260" y2="226"/>
  <line class="w" x1="170" y1="180" x2="260" y2="180"/>
  <line x1="248" y1="228" x2="248" y2="262" stroke="#2C2C2A" stroke-width="3"/>
  <line class="w" x1="248" y1="236" x2="260" y2="226"/>
  <line class="w" x1="248" y1="254" x2="260" y2="264" marker-end="url(#arrow)"/>
  <line class="w" x1="260" y1="264" x2="260" y2="340"/>
  <line x1="222" y1="224" x2="240" y2="236" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="222" y1="238" x2="240" y2="250" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="274" y="262" dominant-baseline="central">S1</text>

  <!-- 센서 2 포토트랜지스터 -->
  <line x1="380" y1="100" x2="380" y2="115" stroke="#1D9E75" stroke-width="1.5"/>
  <rect x="372" y="115" width="16" height="40" rx="2" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <text class="ts" x="394" y="135" dominant-baseline="central">10kΩ</text>
  <line class="w" x1="380" y1="155" x2="380" y2="226"/>
  <path class="w" d="M170 210 L252 210 A8 8 0 0 1 268 210 L380 210"/>
  <line x1="368" y1="228" x2="368" y2="262" stroke="#2C2C2A" stroke-width="3"/>
  <line class="w" x1="368" y1="236" x2="380" y2="226"/>
  <line class="w" x1="368" y1="254" x2="380" y2="264" marker-end="url(#arrow)"/>
  <line class="w" x1="380" y1="264" x2="380" y2="340"/>
  <line x1="342" y1="224" x2="360" y2="236" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="342" y1="238" x2="360" y2="250" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="394" y="262" dominant-baseline="central">S2</text>

  <!-- 센서 1 IR LED -->
  <line x1="510" y1="60" x2="510" y2="90" stroke="#D85A30" stroke-width="1.5"/>
  <rect x="502" y="90" width="16" height="50" rx="2" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <text class="ts" x="524" y="115" dominant-baseline="central">200Ω</text>
  <line class="w" x1="510" y1="140" x2="510" y2="180"/>
  <polygon points="500,180 520,180 510,198" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
  <line x1="500" y1="198" x2="520" y2="198" stroke="#2C2C2A" stroke-width="1.5"/>
  <line class="w" x1="510" y1="198" x2="510" y2="340"/>
  <line x1="522" y1="186" x2="538" y2="176" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="522" y1="196" x2="538" y2="186" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="524" y="230" dominant-baseline="central">S1</text>

  <!-- 센서 2 IR LED -->
  <line x1="600" y1="60" x2="600" y2="90" stroke="#D85A30" stroke-width="1.5"/>
  <rect x="592" y="90" width="16" height="50" rx="2" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <text class="ts" x="614" y="115" dominant-baseline="central">200Ω</text>
  <line class="w" x1="600" y1="140" x2="600" y2="180"/>
  <polygon points="590,180 610,180 600,198" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
  <line x1="590" y1="198" x2="610" y2="198" stroke="#2C2C2A" stroke-width="1.5"/>
  <line class="w" x1="600" y1="198" x2="600" y2="340"/>
  <line x1="612" y1="186" x2="628" y2="176" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="612" y1="196" x2="628" y2="186" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="614" y="230" dominant-baseline="central">S2</text>

  <!-- 연결점 -->
  <circle cx="260" cy="100" r="3" fill="#1D9E75"/><circle cx="380" cy="100" r="3" fill="#1D9E75"/>
  <circle cx="510" cy="60" r="3" fill="#D85A30"/><circle cx="600" cy="60" r="3" fill="#D85A30"/>
  <circle cx="260" cy="180" r="3" fill="#2C2C2A"/><circle cx="380" cy="210" r="3" fill="#2C2C2A"/>
  <circle cx="260" cy="340" r="3" fill="#888780"/><circle cx="380" cy="340" r="3" fill="#888780"/>
  <circle cx="510" cy="340" r="3" fill="#888780"/><circle cx="600" cy="340" r="3" fill="#888780"/>

  <text class="ts" x="320" y="370" text-anchor="middle" dominant-baseline="central">포토트랜지스터 (풀업 3.3V)</text>
  <text class="ts" x="555" y="370" text-anchor="middle" dominant-baseline="central">IR LED (5V)</text>

  <!-- 범례 -->
  <line x1="40" y1="550" x2="64" y2="550" stroke="#D85A30" stroke-width="2"/>
  <text class="ts" x="70" y="550" dominant-baseline="central">5V (USB)</text>
  <line x1="150" y1="550" x2="174" y2="550" stroke="#1D9E75" stroke-width="2"/>
  <text class="ts" x="180" y="550" dominant-baseline="central">3.3V</text>
  <line x1="240" y1="550" x2="264" y2="550" stroke="#888780" stroke-width="2"/>
  <text class="ts" x="270" y="550" dominant-baseline="central">GND (모두 같은 GND)</text>
  <circle cx="420" cy="550" r="3" fill="#2C2C2A"/>
  <text class="ts" x="430" y="550" dominant-baseline="central">연결점 (반원은 연결 없이 넘어감)</text>
</svg>
